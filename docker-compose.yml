services:
  provider:
    build:
      context: .
      dockerfile: Dockerfile.provider
    container_name: infraflow-provider
    environment:
      INFRAFLOW_AGENT_TOKEN: changeme-dev-token-please-change
    volumes:
      - ./docker/provider-data:/data/provider
      - ./docker/tls:/etc/infraflow/tls
    ports:
      - "8443:8443"
      - "8080:8080"
    networks:
      - infraflow-lab
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: infraflow-agent
    depends_on:
      - provider
    environment:
      INFRAFLOW_AGENT_TOKEN: changeme-dev-token-please-change
    volumes:
      - ./docker/agent-data:/data/agent
      - ./docker/tls:/etc/infraflow/tls
    networks:
      - infraflow-lab
    restart: unless-stopped

networks:
  infraflow-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

[
  {
    "name": "Inspect declared InfraFlow devices",
    "hosts": "network",
    "gather_facts": false,
    "tasks": [
      {
        "name": "Display declared device metadata",
        "ansible.builtin.debug": {
          "msg": "device={{ inventory_hostname }} vendor={{ hostvars[inventory_hostname].infraflow_vendor | default('unknown') }} model={{ hostvars[inventory_hostname].infraflow_model | default('unknown') }} os_version={{ hostvars[inventory_hostname].infraflow_os_version | default('unknown') }}"
        }
      }
    ]
  }
]

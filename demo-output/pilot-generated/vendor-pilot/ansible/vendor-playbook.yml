[
  {
    "gather_facts": false,
    "hosts": "CiscoR1",
    "name": "InfraFlow vendor configuration for CiscoR1",
    "serial": 1,
    "tasks": [
      {
        "ansible.builtin.assert": {
          "fail_msg": "Refusing device changes. Review the generated plan and set INFRAFLOW_APPLY=true only when authorized.",
          "that": [
            "ansible_check_mode or lookup('env', 'INFRAFLOW_APPLY') == 'true'"
          ]
        },
        "name": "Require explicit safety opt-in"
      },
      {
        "cisco.ios.ios_l3_interfaces": {
          "config": [
            {
              "ipv4": [
                {
                  "address": "192.0.2.1/24"
                }
              ],
              "name": "GigabitEthernet0/0/0"
            }
          ],
          "state": "merged"
        },
        "name": "Render Cisco interface configuration"
      }
    ]
  },
  {
    "gather_facts": false,
    "hosts": "FortiGate1",
    "name": "InfraFlow vendor configuration for FortiGate1",
    "serial": 1,
    "tasks": [
      {
        "ansible.builtin.assert": {
          "fail_msg": "Refusing device changes. Review the generated plan and set INFRAFLOW_APPLY=true only when authorized.",
          "that": [
            "ansible_check_mode or lookup('env', 'INFRAFLOW_APPLY') == 'true'"
          ]
        },
        "name": "Require explicit safety opt-in"
      },
      {
        "fortinet.fortios.fortios_system_interface": {
          "state": "present",
          "system_interface": {
            "ip": "{{ item.ip | default(omit) }}",
            "mode": "{{ item.mode }}",
            "name": "{{ item.name }}"
          },
          "vdom": "root"
        },
        "loop": [
          {
            "ip": "203.0.113.1/24",
            "mode": "static",
            "name": "port2"
          }
        ],
        "name": "Render FortiGate interface addresses"
      }
    ]
  },
  {
    "gather_facts": false,
    "hosts": "MikroTikR1",
    "name": "InfraFlow vendor configuration for MikroTikR1",
    "serial": 1,
    "tasks": [
      {
        "ansible.builtin.assert": {
          "fail_msg": "Refusing device changes. Review the generated plan and set INFRAFLOW_APPLY=true only when authorized.",
          "that": [
            "ansible_check_mode or lookup('env', 'INFRAFLOW_APPLY') == 'true'"
          ]
        },
        "name": "Require explicit safety opt-in"
      },
      {
        "community.routeros.api_modify": {
          "data": [
            {
              "address": "198.51.100.1/24",
              "interface": "ether2"
            }
          ],
          "hostname": "198.51.100.10",
          "password": "{{ ansible_password }}",
          "path": "ip address",
          "username": "{{ ansible_user }}"
        },
        "name": "Render MikroTik interface addresses"
      }
    ]
  }
]

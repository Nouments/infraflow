id: infraflow.cisco.iosxe.native
version: "1"
manufacturer: cisco
model: "*"
os_family: iosxe
os_versions:
  - "*"
provisioning_method: native-config
template_file: native.cfg.tmpl
features:
  - system.hostname
  - interfaces.ipv4_static

id: infraflow.fortinet.fortios.native
version: "1"
manufacturer: fortinet
model: "*"
os_family: fortios
os_versions:
  - "*"
provisioning_method: native-config
template_file: native.conf.tmpl
features:
  - system.hostname
  - interfaces.ipv4_static
  - interfaces.ipv4_dhcp
  - interfaces.admin_state
  - routes.static_ipv4
variables:

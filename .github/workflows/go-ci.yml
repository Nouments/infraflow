name: Go CI

on:
  push:
    branches: [develop, main, 'feature/**']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build ./provider/cmd ./agent/cmd
      - run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: git diff --check

  presentation-demo:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Launch presentation demo
        id: demo
        run: bash scripts/presentation-demo-launch.sh
      - name: Verify generated presentation artifacts
        env:
          DEMO_ROOT: ${{ steps.demo.outputs.root }}
        run: python3 scripts/presentation-demo-verify.py "$DEMO_ROOT"
      - name: Verify real Agent multisite synchronization
        run: go test -count=1 ./agent/internal/application -run '^TestMultiSiteAgentCLITransfersOnlyAuthorizedArtifacts$'

  windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
      CC: gcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - run: go test -count=1 ./...
        shell: pwsh
      - run: go vet ./...
        shell: pwsh
      - run: go build ./provider/cmd ./agent/cmd
        shell: pwsh
      - run: |
          $goFiles = git ls-files '*.go'
          $unformatted = gofmt -l $goFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted) {
            Write-Error "gofmt required for: $($unformatted -join ', ')"
            exit 1
          }
        shell: pwsh
      - run: git diff --check
        shell: pwsh
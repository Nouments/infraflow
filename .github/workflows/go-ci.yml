name: Go CI

on:
  push:
    branches: [develop, main, 'feature/**']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: true
      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build ./provider/cmd ./agent/cmd
      - name: Enforce Agent package coverage
        run: |
          go test -count=1 -coverprofile=agent-processor.cover ./agent/internal/adapters/processor
          go test -count=1 -coverprofile=agent-cli.cover ./agent/internal/delivery/cli
          processor_coverage=$(go tool cover -func=agent-processor.cover | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          cli_coverage=$(go tool cover -func=agent-cli.cover | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          awk -v processor="$processor_coverage" -v cli="$cli_coverage" 'BEGIN {
            if (processor < 90 || cli < 65) {
              printf "Agent coverage below threshold: processor=%s%% (need 90%%), cli=%s%% (need 65%%)\n", processor, cli
              exit 1
            }
            printf "Agent coverage thresholds met: processor=%s%%, cli=%s%%\n", processor, cli
          }'
      - run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: git diff --check

  presentation-demo:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: true
      - name: Launch presentation demo
        id: demo
        run: bash scripts/presentation-demo-launch.sh
      - name: Verify generated presentation artifacts
        env:
          DEMO_ROOT: ${{ steps.demo.outputs.root }}
        run: python3 scripts/presentation-demo-verify.py "$DEMO_ROOT"
      - name: Verify real Agent multisite synchronization
        run: go test -count=1 ./agent/internal/application -run '^TestMultiSiteAgentCLITransfersOnlyAuthorizedArtifacts$'

  windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
      CC: gcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - run: go test -count=1 ./...
        shell: pwsh
      - run: go vet ./...
        shell: pwsh
      - run: go build ./provider/cmd ./agent/cmd
        shell: pwsh
      - run: |
          $goFiles = git ls-files '*.go'
          $unformatted = gofmt -l $goFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted) {
            Write-Error "gofmt required for: $($unformatted -join ', ')"
            exit 1
          }
        shell: pwsh
      - run: git diff --check
        shell: pwsh

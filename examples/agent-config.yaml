
agent:
  id: site-agent-01
  site_id: site-a
  # Keep well below the Provider's agent_heartbeat_timeout_seconds (default 90).
  heartbeat_interval_seconds: 30
  capabilities:
    - inventory
    - topology
  state_directory: /var/lib/infraflow-agent

provider:
  address: localhost:8443
  api_address: http://127.0.0.1:8080
  token_env: INFRAFLOW_AGENT_TOKEN
  tls:
    enabled: false

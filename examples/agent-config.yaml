agent:
  id: site-agent-01
  site_id: site-01
  capabilities:
    - inventory
    - topology
  state_directory: ./agent-data

provider:
  address: 127.0.0.1:8443
  api_address: http://127.0.0.1:8080
  token_env: INFRAFLOW_AGENT_TOKEN
  tls:
    enabled: false

# For remote or cloud deployments, use the actual provider DNS/IP and enable TLS:
# provider:
#   address: 203.0.113.10:8443
#   token_env: INFRAFLOW_AGENT_TOKEN
#   tls:
#     enabled: true
#     ca_file: /etc/infraflow/provider-ca.pem

sites:
  - name: fortios-lab
    devices:
      - name: FG60F
        vendor: fortinet
        family: fortios
        model: FG-60F
        os_version: "7.4.5"
        provisioning:
          method: native-config
        network:
          vdom: root
          interfaces:
            - name: port1
              role: wan
              ipv4_mode: static
              ipv4_address: 192.0.2.1/24
              enabled: true
          routes:
            - destination: 198.51.100.0/24
              next_hop: 192.0.2.254
              interface: port1
              distance: 7
              fortinet_sequence: 10

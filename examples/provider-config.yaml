listen_address: 127.0.0.1:8443
api_listen_address: 127.0.0.1:8080

web_ui_enabled: true

artifact_directory: /var/lib/infraflow-provider
database_path: /var/lib/infraflow-provider/.infraflow-users.sqlite3

token_env: INFRAFLOW_AGENT_TOKEN

admin_username: admin
admin_credential_file: /var/lib/infraflow-provider/.infraflow-admin-password
admin_credential_script: /var/lib/infraflow-provider/get-admin-password.sh

session_ttl_minutes: 480
chunk_size: 65536

tls:
  certificate_file: ""
  key_file: ""

# For remote or cloud deployments, bind to the public interface and provide a TLS
# certificate/key pair for the provider listener and API listener.

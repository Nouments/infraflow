config global
    config system global
        set hostname fgt1
    end
end
config vdom
    edit root
        config system interface
            edit "port1"
                set mode static
                set ip 192.0.2.31 255.255.255.0
                set status up
            next
            edit "port2"
                set mode static
                set ip 198.51.100.193 255.255.255.192
                set status up
            next
        end
        config router static
            edit 10
                set dst 203.0.113.0 255.255.255.0
                set gateway 192.0.2.2
                set device "port1"
            next
        end
    next
end
# InfraFlow finalization lab, isolated GNS3 project infraflow-e2e-20261119.
# TEST-NET addressing only. Two sites, each synchronized by its own Agent.
sites:
  - name: iosv-lab
    id: iosv-lab
    bootstrap:
      network: 192.0.2.0/24
      service_address: 192.0.2.2
    services:
      dhcp: true
      tftp: true
    devices:
      - name: r2
        role: router
        vendor: cisco
        family: ios
        model: "7200"
        os_version: "12.4(24)T5"
        provisioning:
          method: cisco-autoinstall
        identity:
          macs: ["ca:01:43:c9:00:00"]
        management:
          ipv4: 192.0.2.12
        network:
          interfaces:
            - name: FastEthernet0/0
              role: management
              ipv4_mode: static
              ipv4_address: 192.0.2.12/24
              enabled: true
          routes:
            - destination: 203.0.113.0/24
              next_hop: 192.0.2.2
  - name: vendor-lab
    id: vendor-lab
    devices:
      - name: r1
        role: router
        vendor: cisco
        family: ios
        model: iosv
        os_version: "15.9(3)M6"
        # IOSv AutoInstall is PARTIAL (appliance never requests a lease), so r1
        # is managed by the cisco.ios.configure executor over SSH; its day-0
        # access is set on the console.
        provisioning:
          method: ssh
        management:
          ipv4: 192.0.2.11
        network:
          interfaces:
            - name: GigabitEthernet0/0
              role: management
              ipv4_mode: static
              ipv4_address: 192.0.2.11/24
              enabled: true
            - name: GigabitEthernet0/1
              role: lan
              ipv4_mode: static
              ipv4_address: 198.51.100.1/24
              enabled: true
          routes:
            - destination: 203.0.113.0/24
              next_hop: 192.0.2.2
      - name: r3
        role: router
        vendor: cisco
        family: iosxe
        model: csr1000v
        os_version: "16.7.1"
        # Managed over SSH by cisco.ios.configure; day-0 access set on the console.
        provisioning:
          method: ssh
        management:
          ipv4: 192.0.2.13
        network:
          interfaces:
            - name: GigabitEthernet1
              role: management
              ipv4_mode: static
              ipv4_address: 192.0.2.13/24
              enabled: true
      - name: mt1
        role: router
        vendor: mikrotik
        family: routeros
        model: CHR
        os_version: "7.8"
        provisioning:
          method: auto-rsc
          template_version: "1"
        management:
          ipv4: 192.0.2.21
        network:
          interfaces:
            - name: ether1
              role: management
              ipv4_mode: static
              ipv4_address: 192.0.2.21/24
            - name: ether2
              role: lan
              ipv4_mode: static
              ipv4_address: 198.51.100.129/25
          routes:
            - destination: 203.0.113.0/24
              next_hop: 192.0.2.2
        routing:
          ospf:
            enabled: true
            router_id: 192.0.2.21
      - name: fgt1
        role: firewall
        vendor: fortinet
        family: fortios
        model: FortiGate-VM64-KVM
        os_version: "7.0.8"
        provisioning:
          method: fortios-native
        management:
          ipv4: 192.0.2.31
        network:
          vdom: root
          interfaces:
            - name: port1
              role: management
              ipv4_mode: static
              ipv4_address: 192.0.2.31/24
              enabled: true
          routes:
            - destination: 203.0.113.0/24
              next_hop: 192.0.2.2
              interface: port1
              fortinet_sequence: 10

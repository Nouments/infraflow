# Reference ISC dhcpd for the InfraFlow IOSv AutoInstall comparison (DIA-09).
authoritative;
echo-client-id true;
default-lease-time 3600;
max-lease-time 7200;
option tftp-server-address code 150 = ip-address;
log-facility local7;
subnet 10.99.0.0 netmask 255.255.255.0 {
  range 10.99.0.100 10.99.0.150;
  option routers 10.99.0.1;
  option subnet-mask 255.255.255.0;
  next-server 10.99.0.1;
  option tftp-server-name "10.99.0.1";
  option tftp-server-address 10.99.0.1;
  option vendor-encapsulated-options "5A1N;B2;K4;I10.99.0.1;J80";
}
